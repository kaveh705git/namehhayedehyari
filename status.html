></span></div></div><div class="signature-area"><div class="signature-box"><label>امضای تأییدکننده :</label><span id="previewApprover" class="preview-field"></span></div></div></div></div></div><script>document.addEventListener('contextmenu',function(e){e.preventDefault()});document.addEventListener('keydown',function(e){if(e.key==='F12'||e.keyCode===123){e.preventDefault();return false}if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='C'||e.keyCode===73||e.keyCode===74||e.keyCode===67)){e.preventDefault();return false}if(e.ctrlKey&&(e.key==='U'||e.keyCode===85)){e.preventDefault();return false}});(function(){'use strict';function toPersianDigits(str){if(str===null||str===undefined)return'';const persian='۰۱۲۳۴۵۶۷۸۹';const latin='0123456789';let result=str.toString();for(let i=0;i<10;i++){result=result.replace(new RegExp(latin[i],'g'),persian[i])}return result}function toEnglishDigits(str){if(!str)return'';const persian='۰۱۲۳۴۵۶۷۸۹';const arabic='٠١٢٣٤٥٦٧٨٩';let result=str;for(let i=0;i<10;i++){result=result.replace(new RegExp(persian[i],'g'),i);result=result.replace(new RegExp(arabic[i],'g'),i)}return result}function extractFirstNumber(str){if(!str)return 0;const latinStr=toEnglishDigits(str);const match=latinStr.match(/[0-9]+(\.[0-9]+)?/);return match?parseFloat(match[0]):0}function cleanNumberString(str){if(!str)return'';let s=toEnglishDigits(str);s=s.replace(/[^0-9.]/g,'');const parts=s.split('.');if(parts.length>2)s=parts[0]+'.'+parts.slice(1).join('');return s}function parseNumber(str){const cleaned=cleanNumberString(str);if(cleaned===''||cleaned==='.')return 0;const num=parseFloat(cleaned);return isNaN(num)?0:num}function formatNumber(num){if(num===0||isNaN(num))return'';const rounded=Math.round(num*100)/100;const parts=rounded.toString().split('.');parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return toPersianDigits(parts.join('.'))}function numberToPersianWords(num){if(num===0)return'صفر';if(isNaN(num)||num===null)return'';num=Math.floor(num);if(num===0)return'صفر';const yekan=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه'];const dahgan=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];const dahyek=['ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];const sadgan=['','یکصد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];const scales=['','هزار','میلیون','میلیارد','بیلیون'];function threeDigitsToWords(n){let parts=[];const sad=Math.floor(n/100);const remainder=n%100;if(sad>0)parts.push(sadgan[sad]);if(remainder>=10&&remainder<20){parts.push(dahyek[remainder-10])}else{const dah=Math.floor(remainder/10);const yek=remainder%10;if(dah>0)parts.push(dahgan[dah]);if(yek>0)parts.push(yekan[yek])}return parts.join(' و ')}let numStr=num.toString();let parts=[];let scaleIndex=0;while(numStr.length>0){const chunk=numStr.slice(-3);numStr=numStr.slice(0,-3);const chunkNum=parseInt(chunk,10);if(chunkNum>0){let word=threeDigitsToWords(chunkNum);if(scales[scaleIndex])word+=' '+scales[scaleIndex];parts.unshift(word)}scaleIndex++}return parts.join(' و ')}const inputDay=document.getElementById('inputDay');const inputMonth=document.getElementById('inputMonth');const inputYear=document.getElementById('inputYear');const monthNames=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];for(let i=1;i<=31;i++){let opt=document.createElement('option');opt.value=toPersianDigits(i.toString().padStart(2,'0'));opt.text=toPersianDigits(i.toString());inputDay.appendChild(opt)}monthNames.forEach(name=>{let opt=document.createElement('option');opt.value=name;opt.text=name;inputMonth.appendChild(opt)});for(let i=1405;i<=1415;i++){let opt=document.createElement('option');opt.value=toPersianDigits(i.toString());opt.text=toPersianDigits(i.toString());inputYear.appendChild(opt)}const ROW_COUNT=7;const formTableBody=document.getElementById('formTableBody');const previewTableBody=document.getElementById('previewTableBody');for(let i=0;i<ROW_COUNT;i++){const trForm=document.createElement('tr');trForm.innerHTML=`<td style="text-align:center;font-weight:700;font-size:12pt;">${toPersianDigits(i+1)}</td><td><input type="text" class="f-desc" data-row="${i+1}" placeholder="شرح..."></td><td><input type="text" class="f-qty" data-row="${i+1}" placeholder="تعداد"></td><td><input type="text" class="f-unit" data-row="${i+1}" placeholder="مبلغ"></td>`;formTableBody.appendChild(trForm);const trPreview=document.createElement('tr');trPreview.innerHTML=`<td>${toPersianDigits(i+1)}</td><td id="p-desc-${i+1}"></td><td id="p-qty-${i+1}"></td><td id="p-unit-${i+1}"></td><td id="p-total-${i+1}"></td>`;previewTableBody.appendChild(trPreview)}function updatePreview(){document.getElementById('previewVillage').textContent=document.getElementById('inputVillage').value;document.getElementById('previewMetaNumber').textContent=document.getElementById('inputMetaNumber').value;document.getElementById('previewContract').textContent=document.getElementById('inputContract').value;document.getElementById('previewApprover').textContent=document.getElementById('inputApprover').value;document.getElementById('previewDay').textContent=inputDay.value;document.getElementById('previewMonth').textContent=inputMonth.value;document.getElementById('previewYear').textContent=inputYear.value;let grandTotal=0;for(let i=1;i<=ROW_COUNT;i++){const desc=document.querySelector(`.f-desc[data-row="${i}"]`).value;const qtyStr=document.querySelector(`.f-qty[data-row="${i}"]`).value;const unitStr=document.querySelector(`.f-unit[data-row="${i}"]`).value;const qty=extractFirstNumber(qtyStr);const unit=parseNumber(unitStr);const rowTotal=qty*unit;grandTotal+=rowTotal;document.getElementById(`p-desc-${i}`).textContent=desc;document.getElementById(`p-qty-${i}`).textContent=qtyStr;document.getElementById(`p-unit-${i}`).textContent=unitStr?formatNumber(unit):'';document.getElementById(`p-total-${i}`).textContent=rowTotal>0?formatNumber(rowTotal):''}document.getElementById('previewSumTotal').textContent=grandTotal>0?formatNumber(grandTotal):'';if(grandTotal>0){document.getElementById('previewPayable').textContent=numberToPersianWords(grandTotal)+' ریال'}else{document.getElementById('previewPayable').textContent=''}}document.getElementById('inputMetaNumber').addEventListener('input',function(){this.value=toPersianDigits(this.value);updatePreview()});document.getElementById('inputContract').addEventListener('input',function(){this.value=toPersianDigits(this.value);updatePreview()});document.getElementById('inputVillage').addEventListener('input',updatePreview);document.getElementById('inputApprover').addEventListener('input',updatePreview);inputDay.addEventListener('change',updatePreview);inputMonth.addEventListener('change',updatePreview);inputYear.addEventListener('change',updatePreview);formTableBody.addEventListener('input',function(e){if(!e.target.matches('input'))return;const val=e.target.value;if(e.target.classList.contains('f-qty')||e.target.classList.contains('f-unit')){e.target.value=toPersianDigits(val)}updatePreview()});formTableBody.addEventListener('blur',function(e){if(e.target.classList.contains('f-unit')){const val=e.target.value;if(val){const num=parseNumber(val);if(num>0)e.target.value=formatNumber(num)}updatePreview()}},true);updatePreview();window.addEventListener('load',function(){setTimeout(function(){const savedProfileStr=localStorage.getItem('site_user_profile');if(!savedProfileStr)return;try{const profile=JSON.parse(savedProfileStr);if(!profile.villageName)return;function fillAndLock(id,value){const el=document.getElementById(id);if(el&&value){el.value=value;el.dispatchEvent(new Event('input',{bubbles:true}));el.readOnly=true}}fillAndLock('inputVillage',profile.villageName);fillAndLock('inputApprover',profile.employerName)}catch(e){console.error('خطا در خواندن اطلاعات:',e)}},500)})})();</script></body></html>
