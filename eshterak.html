<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم اطلاعات دهیاری و شورا</title>
    <style>
        /* تنظیمات کلی صفحه */
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f0f4f8; /* رنگ پس‌زمینه آبی روشن شبیه عکس */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* کانتینر اصلی فرم */
        .form-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* عنوان فرم */
        .form-title {
            text-align: right;
            font-weight: bold;
            margin-bottom: 30px;
            font-size: 16px;
            color: #2c3e50;
        }

        /* ردیف‌ها */
        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        /* ستون‌ها */
        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* برچسب‌ها (Label) */
        label {
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #34495e;
            text-align: right;
        }

        /* فیلدهای ورودی (Input) */
        input {
            padding: 12px 15px;
            border: 1px solid #dce4ec;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            color: #333;
            background-color: #fbfcfd;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #1abc9c;
            background-color: #fff;
        }

        /* رنگ متفاوت برای متن Placeholder (متن راهنما) */
        input::placeholder {
            color: #95a5a6;
        }

        /* دکمه ثبت */
        .submit-btn {
            background-color: #1abc9c; /* رنگ سبز مشابه عکس */
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #16a085;
        }

        /* ریسپانسیو برای موبایل (زیر هم قرار گرفتن فیلدها) */
        @media (max-width: 600px) {
            .form-container {
                padding: 20px;
            }
            .row {
                flex-direction: column;
                gap: 15px;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="form-title">اطلاعات دهیاری</div>

    <!-- ردیف اول -->
    <div class="row">
        <!-- ستون سمت راست (اول در کد) -->
        <div class="column">
            <label>نام روستا</label>
            <input type="text" placeholder="مثلاً: تموغه">
        </div>
        <!-- ستون سمت چپ -->
        <div class="column">
            <label>نام و نام خانوادگی رئیس شورا</label>
            <input type="text" placeholder="نام رئیس شورا">
        </div>
    </div>

    <!-- ردیف دوم -->
    <div class="row">
        <!-- ستون سمت راست -->
        <div class="column">
            <label>نام و نام خانوادگی دهیار</label>
            <input type="text" placeholder="مثلاً: کاوه عبدی">
        </div>
        <!-- ستون سمت چپ -->
        <div class="column">
            <label>نام و نام خانوادگی نایب رئیس شورا</label>
            <input type="text" placeholder="نام نایب رئیس">
        </div>
    </div>

    <!-- ردیف سوم -->
    <div class="row">
        <!-- ستون سمت راست -->
        <div class="column">
            <label>شماره تماس دهیار</label>
            <input type="text" placeholder="مثلاً: ۰۹۱۲۳۴۵۶۷۸۹">
        </div>
        <!-- ستون سمت چپ -->
        <div class="column">
            <label>نام و نام خانوادگی منشی شورا</label>
            <input type="text" placeholder="نام منشی">
        </div>
    </div>

    <!-- دکمه ثبت -->
    <button class="submit-btn">ثبت درخواست و دریافت لینک پرداخت</button>
</div>

</body>
</html>
