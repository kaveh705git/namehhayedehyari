<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نامه‌های دهیاری</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', Tahoma, sans-serif; }
  :root {
    --primary: #1e5fa8;
    --primary-dark: #143f70;
    --primary-light: #3b82d6;
    --text: #1a2b45;
    --shadow: 0 4px 20px rgba(30, 95, 168, 0.15);
  }
  body {
    background: linear-gradient(135deg, #e8f1fc 0%, #f0f6ff 100%);
    min-height: 100vh;
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    padding: 15px 20px;
    box-shadow: var(--shadow);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 15px;
  }
  
  /* پس‌زمینه لوگو دقیقا رنگ هدر شد و حاشیه سفید حذف شد */
  .logo {
    width: 56px; 
    height: 56px;
    border-radius: 50%;
    background: transparent; /* شفاف شد تا رنگ آبی هدر دیده شود */
    object-fit: contain; /* کل لوگو داخل کادر دیده شود */
    border: none; /* حاشیه سفید حذف شد */
    flex-shrink: 0;
  }
  .logo-fallback {
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,255,255,0.2); 
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: #fff; font-weight: bold;
    flex-shrink: 0;
  }
  #siteTitle {
    font-size: 20px;
    font-weight: 700;
    user-select: none;
    white-space: nowrap;
  }
  
  /* استایل جدید و مرتب برای تاریخ و دکمه خروج */
  .header-actions {
    margin-right: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-date {
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
  }

  #logoutBtn {
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.5);
    padding: 6px 14px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: none;
    white-space: nowrap;
    transition: background 0.2s;
  }
  #logoutBtn:hover { background: rgba(255,255,255,0.3); }

  main {
    flex: 1;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    padding: 40px 20px;
  }
  .hero-title {
    text-align: center;
    color: var(--primary-dark);
    margin-bottom: 10px;
    font-size: 24px;
  }
  .hero-sub {
    text-align: center;
    color: #5a7292;
    margin-bottom: 40px;
    font-size: 14px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 25px 20px;
    box-shadow: var(--shadow);
    border-top: 4px solid var(--primary-light);
    transition: transform 0.25s, box-shadow 0.25s;
    cursor: pointer;
    text-decoration: none;
    color: var(--text);
    display: block;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 30px rgba(30, 95, 168, 0.25);
  }
  .card-icon {
    width: 50px; height: 50px;
    background: linear-gradient(135deg, var(--primary-light), var(--primary));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    margin-bottom: 15px;
    color: #fff;
  }
  .card h3 {
    font-size: 17px;
    margin-bottom: 8px;
    color: var(--primary-dark);
  }
  footer {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: #e6f0fb;
    text-align: center;
    padding: 20px;
    font-size: 13px;
    margin-top: 40px;
  }
  footer span { color: #ff8fa3; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 35, 65, 0.65);
    backdrop-filter: blur(5px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .overlay.active { display: flex; }
  .modal {
    background: #fff;
    border-radius: 20px;
    padding: 30px 25px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: popIn 0.3s ease;
  }
  @keyframes popIn {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal h2 {
    color: var(--primary-dark);
    text-align: center;
    margin-bottom: 20px;
    font-size: 19px;
  }
  .modal input[type="password"] {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #d5e3f5;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 15px;
    font-family: inherit;
    transition: border-color 0.2s;
    background: #f7faff;
  }
  .modal input:focus {
    outline: none;
    border-color: var(--primary-light);
    background: #fff;
  }
  .modal label {
    font-size: 13px;
    color: #5a7292;
    display: block;
    margin-bottom: 6px;
  }
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    background: linear-gradient(135deg, var(--primary-light), var(--primary));
    color: #fff;
  }
  .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .error-msg {
    color: #c0394f;
    font-size: 13px;
    text-align: center;
    margin-bottom: 10px;
    min-height: 18px;
  }

  /* تنظیمات مخصوص موبایل برای جلوگیری از به هم ریختگی هدر */
  @media (max-width: 600px) {
    .header-inner {
      flex-direction: column;
      gap: 12px;
    }
    #siteTitle {
      font-size: 18px;
    }
    .header-actions {
      margin-right: 0;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }
    .header-date, #logoutBtn {
      flex: 1;
      text-align: center;
      justify-content: center;
      padding: 8px;
    }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    
    <!-- آرم سایت -->
    <img src="logo.png" alt="لوگو" class="logo" 
         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <div class="logo-fallback" style="display:none;">🏛</div>
    
    <h1 id="siteTitle">نامه‌های دهیاری</h1>
    
    <!-- بخش تاریخ و دکمه خروج در یک کادر مرتب -->
    <div class="header-actions">
      <div class="header-date" id="shamsiDate">📅 در حال بارگذاری...</div>
      <button id="logoutBtn" onclick="logout()">🚪 خروج</button>
    </div>

  </div>
</header>

<main>
  <h2 class="hero-title">به سامانه نامه‌های دهیاری خوش آمدید</h2>
  <p class="hero-sub">برای دسترسی به هر بخش، روی کارت مربوطه کلیک کنید</p>
  
  <div class="cards">
    <a href="contract.html" class="card">
      <div class="card-icon">📄</div>
      <h3>قرارداد کار دهیاری</h3>
    </a>
    <a href="status.html" class="card">
      <div class="card-icon">📋</div>
      <h3>صورت وضعیت قرارداد</h3>
    </a>
    <a href="council.html" class="card">
      <div class="card-icon">📑</div>
      <h3>صورت جلسه شورا</h3>
    </a>
    <a href="letter.html" class="card">
      <div class="card-icon">✉️</div>
      <h3>نامه شورا به تطبیق</h3>
    </a>
       <a href="amalkard.html" class="card">
      <div class="card-icon">📑</div>
      <h3>گزارش عملکرد دهیار</h3>
    </a>
  </div>
</main>

<footer>
  تهیه شده با <span>❤</span> توسط کاوه - سال ۱۴۰۵
</footer>

<!-- پنجره ورود -->
<div class="overlay" id="loginOverlay">
  <div class="modal">
    <h2>ورود به سایت</h2>
    <div class="error-msg" id="loginError"></div>
    <label>رمز عبور</label>
    <input type="password" id="loginPassword" placeholder="رمز عبور را وارد کنید" 
           onkeydown="if(event.key==='Enter') doLogin()">
    <button class="btn" onclick="doLogin()">ورود</button>
  </div>
</div>

<script>
  // ============================================================
  // تنظیمات رمزها (فرمت: "رمز": "تاریخ-انقضا")
  // ============================================================
  const SITE_PASSWORDS = {
    "123434": "2026-12-31",
    "112233": "2026-11-15",
    "445566": "2026-10-20",
    "K@veh123": "2026-11-04"
  };
  const AUTH_KEY = 'site_auth_expire';

  // ============================================================
  // توابع تقویم شمسی
  // ============================================================
  function getShamsiDate() {
    const today = new Date();
    let gy = today.getFullYear(), gm = today.getMonth() + 1, gd = today.getDate();
    const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
    let jy = (gy <= 1600) ? 0 : 979;
    gy -= (gy <= 1600) ? 621 : 1600;
    const gy2 = (gm > 2) ? (gy + 1) : gy;
    let days = (365 * gy) + parseInt((gy2 + 3) / 4) - parseInt((gy2 + 99) / 100) + parseInt((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
    jy += 33 * parseInt(days / 12053);
    days %= 12053;
    jy += 4 * parseInt(days / 1461);
    days %= 1461;
    if (days > 365) {
      jy += parseInt((days - 1) / 365);
      days = (days - 1) % 365;
    }
    const jm = (days < 186) ? 1 + parseInt(days / 31) : 7 + parseInt((days - 186) / 30);
    const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
    const weekDays = ["یکشنبه", "دوشنبه", "سه‌شنبه", "چهارشنبه", "پنجشنبه", "جمعه", "شنبه"];
    const dayName = weekDays[today.getDay()];
    const monthNames = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور", "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
    const monthName = monthNames[jm - 1];
    const toPersian = (num) => num.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    return `${dayName} ${toPersian(jd)} ${monthName} ${toPersian(jy)}`;
  }

  // ============================================================
  // دریافت زمان (کلادفلر ← API خارجی ← ساعت مرورگر)
  // ============================================================
  async function getServerTime() {
    try {
      const res = await fetch('/time', { cache: 'no-store' });
      if (res.ok) {
        const data = await res.json();
        return data.serverTime;
      }
      throw new Error('no local time');
    } catch (e) {
      try {
        const res = await fetch('https://worldtimeapi.org/api/timezone/Asia/Tehran', { cache: 'no-store' });
        if (!res.ok) throw new Error('api failed');
        const data = await res.json();
        return new Date(data.datetime).getTime();
      } catch (e2) {
        return Date.now();
      }
    }
  }

  // ============================================================
  // بررسی وضعیت ورود
  // ============================================================
  async function checkAuthStatus() {
    const savedExpire = localStorage.getItem(AUTH_KEY);
    const logoutBtn = document.getElementById('logoutBtn');
    const loginOverlay = document.getElementById('loginOverlay');

    if (!savedExpire) {
      loginOverlay.classList.add('active');
      if (logoutBtn) logoutBtn.style.display = 'none';
      return;
    }

    const expireTime = parseInt(savedExpire, 10);
    if (isNaN(expireTime)) {
      localStorage.removeItem(AUTH_KEY);
      loginOverlay.classList.add('active');
      if (logoutBtn) logoutBtn.style.display = 'none';
      return;
    }

    const now = await getServerTime();
    if (now >= expireTime) {
      localStorage.removeItem(AUTH_KEY);
      loginOverlay.classList.add('active');
      document.getElementById('loginError').style.color = '#c0394f';
      document.getElementById('loginError').textContent = '⏳ زمان دسترسی شما به پایان رسیده است.';
      if (logoutBtn) logoutBtn.style.display = 'none';
      return;
    }

    loginOverlay.classList.remove('active');
    if (logoutBtn) logoutBtn.style.display = 'block';
  }

  // ============================================================
  // ورود
  // ============================================================
  async function doLogin() {
    const pass = document.getElementById('loginPassword').value;
    const err = document.getElementById('loginError');

    if (!SITE_PASSWORDS[pass]) {
      err.style.color = '#c0394f';
      err.textContent = '❌ رمز عبور اشتباه است';
      return;
    }

    err.style.color = '#5a7292';
    err.textContent = 'در حال بررسی زمان...';

    const now = await getServerTime();
    
    let expireDateStr = SITE_PASSWORDS[pass];
    let parts = expireDateStr.split('-');
    if (parts.length === 3) {
      if (parts[1].length === 1) parts[1] = '0' + parts[1];
      if (parts[2].length === 1) parts[2] = '0' + parts[2];
      expireDateStr = parts.join('-');
    }
    
    const expireTime = new Date(expireDateStr + 'T23:59:59').getTime();

    if (now > expireTime) {
      err.style.color = '#c0394f';
      err.textContent = '❌ این رمز منقضی شده است.';
      return;
    }

    localStorage.setItem(AUTH_KEY, expireTime);
    err.style.color = '#1e8e4e';
    err.textContent = '✅ ورود موفق!';
    setTimeout(() => {
      document.getElementById('loginOverlay').classList.remove('active');
      document.getElementById('logoutBtn').style.display = 'block';
    }, 500);
  }

  // ============================================================
  // خروج
  // ============================================================
  function logout() {
    localStorage.removeItem(AUTH_KEY);
    location.reload();
  }

  // ============================================================
  // شروع اجرای برنامه
  // ============================================================
  document.getElementById('shamsiDate').textContent = '📅 ' + getShamsiDate();
  
  checkAuthStatus();
  setInterval(checkAuthStatus, 5000);
</script>
</body>
</html>
