m(i+1)}</option>`).join('');const yearOptions=Array.from({length:20},(_,i)=>`<option value="${1400+i}">${toPersianNum(1400+i)}</option>`).join('');const monthOptions=persianMonths.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');return`<select id="${prefix}-day" onchange="${onchangeFunc}">${dayOptions}</select><select id="${prefix}-month" onchange="${onchangeFunc}">${monthOptions}</select><select id="${prefix}-year" onchange="${onchangeFunc}">${yearOptions}</select>`}function formatPersianDate(dayId,monthId,yearId){const day=document.getElementById(dayId).value;const monthIndex=document.getElementById(monthId).value-1;const year=document.getElementById(yearId).value;return`${toPersianNum(day)} ${persianMonths[monthIndex]} ${toPersianNum(year)}`}function updateMainDate(prefix){const formattedDate=formatPersianDate(`${prefix}-day`,`${prefix}-month`,`${prefix}-year`);const targetId=prefix==='print'?'out-print-date':`out-date-${prefix}`;document.getElementById(targetId).innerText=formattedDate}function updateBoxDate(id){const formattedDate=formatPersianDate(`box-${id}-day`,`box-${id}-month`,`box-${id}-year`);document.getElementById(`print-date-${id}`).innerText=formattedDate}function updateView(elementId,value){const element=document.getElementById(elementId);if(element){element.innerText=value}}let boxCounter=0;function createEditorBoxHTML(id){return`<div class="dynamic-item" id="editor-box-${id}"><div class="form-group"><label>نام دسته</label><input type="text" oninput="updateBoxView(${id}, 'category', this.value)" placeholder="مثلاً: اقدامات انجام شده"></div><div class="form-group"><label>تاریخ ثبت</label><div class="date-select-group">${getDateSelectHTML(`box-${id}`,`updateBoxDate(${id})`)}</div></div><div class="form-group"><label>موضوع</label><input type="text" oninput="updateBoxView(${id}, 'subject', this.value)" placeholder="موضوع اقدام"></div><div class="form-group"><label>توضیحات</label><textarea oninput="updateBoxView(${id}, 'desc', this.value)" placeholder="توضیحات کامل..."></textarea></div><button class="remove-btn" onclick="removeBox(${id})">حذف این مورد</button></div>`}function createPrintBoxHTML(id){return`<div class="content-box" id="print-box-${id}"><div class="box-header"><span>نام دسته: <span id="print-category-${id}"></span></span><span>تاریخ ثبت: <span id="print-date-${id}"></span></span></div><div class="box-title">موضوع: <span id="print-subject-${id}"></span></div><div class="box-body"><strong>توضیحات:</strong> <span id="print-desc-${id}"></span></div></div>`}function addNewBox(){boxCounter++;const id=boxCounter;document.getElementById('boxes-container').insertAdjacentHTML('beforeend',createEditorBoxHTML(id));document.getElementById('print-boxes-container').insertAdjacentHTML('beforeend',createPrintBoxHTML(id));updateBoxDate(id)}function removeBox(id){document.getElementById(`editor-box-${id}`)?.remove();document.getElementById(`print-box-${id}`)?.remove()}function updateBoxView(id,field,value){const target=document.getElementById(`print-${field}-${id}`);if(target)target.innerText=value}window.onload=function(){document.getElementById('print-date-group').innerHTML=getDateSelectHTML('print',"updateMainDate('print')");document.getElementById('from-date-group').innerHTML=getDateSelectHTML('from',"updateMainDate('from')");document.getElementById('to-date-group').innerHTML=getDateSelectHTML('to',"updateMainDate('to')");updateMainDate('print');updateMainDate('from');updateMainDate('to');addNewBox()};window.addEventListener('load',function(){setTimeout(function(){const savedProfileStr=localStorage.getItem('site_user_profile');if(!savedProfileStr)return;try{const profile=JSON.parse(savedProfileStr);function applyValue(input,value){if(!value)return;input.value=value;input.readOnly=true;input.style.backgroundColor='#e2e8f0';input.style.color='#475569';input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true}))}const allInputs=document.querySelectorAll('input[type="text"]');allInputs.forEach(input=>{let labelText="";if(input.previousElementSibling&&input.previousElementSibling.tagName==='LABEL'){labelText=input.previousElementSibling.innerText}else if(input.parentElement&&input.parentElement.querySelector('label')){labelText=input.parentElement.querySelector('label').innerText}if(labelText.includes('دهیاری')||labelText.includes('روستا')){applyValue(input,profile.villageName)}else if(labelText.includes('کارفرما')||labelText.includes('دهیار')){applyValue(input,profile.employerName)}else if(labelText.includes('کد ملی')){applyValue(input,profile.employerNationalId)}})}catch(e){console.error('خطا در خواندن اطلاعات:',e)}},500)});</script></body></html>
