<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>طراحی نامه دهیاری</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css"/>
<link href="https://unpkg.com/vazirmatn@33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{--border-color:#ccc;--bg-color:#f4f4f9}
@font-face{font-family:'Vazirmatn-Local';src:url('./fonts/Vazirmatn-Regular.woff2') format('woff2'),url('./fonts/Vazirmatn-Regular.woff') format('woff');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Vazirmatn-Local';src:url('./fonts/Vazirmatn-Bold.woff2') format('woff2'),url('./fonts/Vazirmatn-Bold.woff') format('woff');font-weight:700;font-style:normal;font-display:swap}
body{font-family:'Vazirmatn','Vazirmatn-Local','Vazir',Tahoma,Arial,sans-serif;margin:0;padding:20px;background-color:var(--bg-color);display:flex;gap:20px;height:100vh;box-sizing:border-box}
.control-panel{width:350px;background:#fff;padding:20px;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,.1);overflow-y:auto;flex-shrink:0}
.control-panel h2{font-size:18px;text-align:center;margin-bottom:20px;color:#555;border-bottom:2px solid #eee;padding-bottom:10px}
.form-group{margin-bottom:15px}
.form-group label{display:block;margin-bottom:5px;font-size:14px;font-weight:700}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px;border:1px solid var(--border-color);border-radius:4px;font-family:inherit;box-sizing:border-box;display:block}
.row-group{display:flex;gap:10px}
.row-group .form-group{flex:1}
.preview-container{flex:1;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto}
.a4-paper{background:#fff;width:210mm;height:297mm;padding:15mm 20mm;box-sizing:border-box;position:relative;display:flex;flex-direction:column;box-shadow:0 0 10px rgba(0,0,0,.1);border:2px solid #222}
.header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #000;padding-bottom:15px;margin-bottom:30px}
.header-right{width:33%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:13px;line-height:1.8;font-weight:700}
.header-center{text-align:center;width:33%}
.header-center .logo{width:70px;height:70px;background-color:#f0f0f0;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:10px;color:#666;border:1px solid #ccc;overflow:hidden}
.header-center .sub-text{font-size:11px;font-weight:700;margin-top:5px;display:block}
.header-left{text-align:left;font-size:13px;width:33%}
.header-left .info-line{margin-bottom:8px;display:flex;justify-content:flex-start;gap:5px}
.letter-body{flex:1;font-size:14px;line-height:2}
.subject{text-align:right;font-weight:700;margin-bottom:25px;font-size:15px}
.recipient{text-align:right;font-weight:700;margin-bottom:20px}
.content{text-align:justify;min-height:100px;white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;padding:0 5px;line-height:2.2}
.footer{margin-top:50px;text-align:left;font-size:13px;font-weight:700;padding-left:20px}
@media print{
  @page{size:A4 portrait;margin:0}
  body{background:#fff;margin:0;padding:0;display:block;font-family:'Vazirmatn','Vazirmatn-Local','Vazir',Tahoma,Arial,sans-serif}
  .control-panel{display:none!important}
  .preview-container{display:block;overflow:visible;width:100%}
  .a4-paper{box-shadow:none;height:280mm;width:210mm;margin:8mm auto;padding:10mm 15mm;border:2px solid #222;border-radius:0;overflow:hidden;page-break-inside:avoid;page-break-after:avoid}
}
</style>

<!-- کد نگهبان -->
<script>

  var _0x4f21='site_auth_expire';
  var _0x1a9d=localStorage.getItem(_0x4f21);
  if(!_0x1a9d){window.location.href='index.html';return}
  var _0x7b2c=parseInt(_0x1a9d,10);
  var _0x3c8e=Date.now();
  if(isNaN(_0x7b2c)||_0x3c8e>=_0x7b2c){
    localStorage.removeItem(_0x4f21);
    localStorage.removeItem('site_user_profile');

  }

</head>
<body>

<div class="control-panel">
  <h2>تنظیمات نامه</h2>
  
  <div class="form-group">
    <label>نام روستا:</label>
    <input type="text" id="input-village" placeholder="مثلا: تموغه" oninput="updateLetter()">
  </div>
  
  <div class="form-group">
    <label>نام دهیار:</label>
    <input type="text" id="input-dehyar-name" placeholder="مثلا: علی محمدی" oninput="updateLetter()">
  </div>
  
  <div class="row-group">
    <div class="form-group">
      <label>شماره نامه:</label>
      <input type="text" id="input-number" placeholder="1234" oninput="updateLetter()">
    </div>
    
    <div class="form-group">
      <label>تاریخ نامه:</label>
      <div style="display:flex;gap:2px;direction:rtl;">
        <select id="day" onchange="updateDate()" style="width:30%;"></select>
        <select id="month" onchange="updateDate()" style="width:40%;">
          <option value="فروردین">فروردین</option><option value="اردیبهشت">اردیبهشت</option><option value="خرداد">خرداد</option><option value="تیر">تیر</option><option value="مرداد">مرداد</option><option value="شهریور">شهریور</option><option value="مهر">مهر</option><option value="آبان">آبان</option><option value="آذر">آذر</option><option value="دی">دی</option><option value="بهمن">بهمن</option><option value="اسفند">اسفند</option>
        </select>
        <select id="year" onchange="updateDate()" style="width:30%;">
          <option value="1404">1404</option><option value="1405" selected>1405</option><option value="1406">1406</option>
        </select>
      </div>
    </div>
  </div>
  
  <div class="form-group">
    <label>موضوع نامه:</label>
    <input type="text" id="input-subject" placeholder="موضوع نامه" oninput="updateLetter()">
  </div>
  
  <div class="form-group">
    <label>خطاب به (ارگان):</label>
    <input type="text" id="input-recipient" placeholder="مثلا: اداره کل آموزش و پرورش" oninput="updateLetter()">
  </div>
  
  <div class="form-group">
    <label>متن نامه:</label>
    <textarea id="input-content" rows="6" placeholder="متن نامه..." oninput="updateLetter()"></textarea>
  </div>
  
  <button onclick="window.print()" style="width:100%;padding:10px;background:#28a745;color:#fff;border:none;border-radius:4px;cursor:pointer;font-family:inherit;">چاپ نامه / خروجی PDF</button>
</div>

<div class="preview-container">
  <div class="a4-paper">
    <div class="header">
      <div class="header-right">
        <div>وزارت کشور</div>
        <div>استانداری استان کردستان</div>
        <div>فرمانداری ویژه شهرستان سقز</div>
        <div>بخشداری بخش مرکزی</div>
        <div id="preview-dehyari-header">دهیاری</div>
      </div>
      
      <div class="header-center">
        <div class="logo">
          <img id="logoImgPlaceholder" src="logo.png" alt="لوگو" style="max-width:100%;max-height:100%;object-fit:contain;">
        </div>
        <span class="sub-text" id="preview-dehyari-logo">دهیاری</span>
      </div>
      
      <div class="header-left">
        <div class="info-line"><span>شماره:</span><span id="preview-number">---------</span></div>
        <div class="info-line"><span>تاریخ:</span><span id="preview-date">---------</span></div>
      </div>
    </div>
    
    <div class="letter-body">
      <div class="subject">موضوع: <span id="preview-subject"></span></div>
      <div class="recipient">از: <span id="preview-dehyari">دهیاری</span><br>به: <span id="preview-recipient">................</span></div>
      <div class="content" id="preview-content"></div>
      <div class="footer">با تشکر<br>دهیار: <span id="preview-dehyar-name">..................</span></div>
    </div>
  </div>
</div>

<script>
// ==========================================
// توابع اصلی فرم
// ==========================================
function populateDays(){
  const daySelect = document.getElementById('day');
  for(let i=1; i<=31; i++){
    const option = document.createElement('option'); option.value = i; option.text = i; daySelect.appendChild(option);
  }
  daySelect.value = 1;
}

function updateDate(){
  const day = document.getElementById('day').value;
  const month = document.getElementById('month').value;
  const year = document.getElementById('year').value;
  document.getElementById('preview-date').innerText = `${day} ${month} ${year}`;
}

function updateLetter(){
  const village = document.getElementById('input-village').value.trim();
  const dehyarName = document.getElementById('input-dehyar-name').value;
  const number = document.getElementById('input-number').value;
  const subject = document.getElementById('input-subject').value;
  const recipient = document.getElementById('input-recipient').value;
  const content = document.getElementById('input-content').value;
  
  let fullDehyariName = village ? `دهیاری ${village}` : 'دهیاری';
  document.getElementById('preview-dehyari-header').innerText = fullDehyariName;
  document.getElementById('preview-dehyari-logo').innerText = fullDehyariName;
  document.getElementById('preview-dehyari').innerText = fullDehyariName;
  document.getElementById('preview-dehyar-name').innerText = dehyarName || '..................';
  document.getElementById('preview-number').innerText = number || '---------';
  document.getElementById('preview-subject').innerText = subject || '................';
  document.getElementById('preview-recipient').innerText = recipient || '................';
  document.getElementById('preview-content').innerText = content || 'متن نامه شما در اینجا نمایش داده می‌شود...';
}

// ==========================================
// شروع و پر کردن خودکار
// ==========================================
window.onload = function(){
  populateDays();
  updateDate();
  updateLetter();
  
  setTimeout(function(){
    var savedProfileStr = localStorage.getItem("site_user_profile");
    if(savedProfileStr){
      try{
        var profile = JSON.parse(savedProfileStr);
        
        // تابعی برای پر کردن و قفل کردن فیلدها
        function fillAndLock(id, value) {
          var el = document.getElementById(id);
          if (el && value) {
            el.value = value;
            el.dispatchEvent(new Event("input", { bubbles: true })); // آپدیت پیش‌نمایش
            
            el.readOnly = true; // قفل کردن
            el.style.backgroundColor = "#e2e8f0";
            el.style.color = "#475569";
            el.style.cursor = "not-allowed";
          }
        }

        // نام روستا (دهیاری)
        fillAndLock("input-village", profile.villageName);
        
        // نام دهیار (کارفرما)
        fillAndLock("input-dehyar-name", profile.employerName);

      } catch(e){
        console.error("خطا در بارگذاری پروفایل:", e);
      }
    }
  }, 500); // کمی صبر می‌کند تا فرم لود شود
};
</script>
</body>
</html>
