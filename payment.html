<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>پرداخت کارت به کارت</title><link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Vazirmatn',Tahoma,sans-serif}body{background:linear-gradient(135deg,#f0f6ff 0%,#e8f1fc 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{background:#fff;border-radius:20px;padding:30px;width:100%;max-width:450px;box-shadow:0 10px 40px rgba(30,95,168,.1);text-align:center}h2{color:#1e5fa8;margin-bottom:20px}.info-box{background:#f8fafc;border:2px dashed #3b82d6;border-radius:12px;padding:20px;margin-bottom:20px}.info-row{display:flex;justify-content:space-between;font-size:16px;margin-bottom:15px;font-weight:700}.info-row:last-child{margin-bottom:0}.card-number{font-size:22px;color:#143f70;letter-spacing:2px;direction:ltr;margin-top:10px}.card-owner{font-size:14px;color:#5a7292;margin-top:5px;font-weight:700}.btn{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;padding:15px;border-radius:10px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;width:100%;text-decoration:none;display:block;margin-top:20px}.btn:hover{filter:brightness(1.1)}.note{font-size:13px;color:#c0394f;margin-top:15px}</style></head><body><div class="card"><h2>پرداخت کارت به کارت</h2><div class="info-box"><div class="info-row"><span>پلن انتخابی:</span><span id="planName"></span></div><div class="info-box" style="padding:10px;margin-bottom:0;"><span style="font-size:14px;color:#555;">مبلغ قابل پرداخت:</span><div class="card-number" id="planPrice" style="font-size:20px;"></div></div></div><div class="info-box"><span style="font-size:14px;color:#555;">شماره کارت جهت واریز:</span><div class="card-number" id="cardNumber"></div><div class="card-owner" id="cardOwnerName"></div></div><a href="#" id="goToDeliveryBtn" class="btn">✅ پرداخت کردم، دریافت رمز</a><div class="note">پس از واریز، روی دکمه بالا بزنید تا رمز شما آماده شود.</div></div><script>document.addEventListener('contextmenu',function(e){e.preventDefault()});document.addEventListener('keydown',function(e){if(e.key==='F12'||e.keyCode===123){e.preventDefault();return false}if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='C'||e.keyCode===73||e.keyCode===74||e.keyCode===67)){e.preventDefault();return false}if(e.ctrlKey&&(e.key==='U'||e.keyCode===85)){e.preventDefault();return false}});const MY_CARD_NUMBER="5022-2910-9825-7650";const MY_NAME="به نام: کاوه عبدی";const urlParams=new URLSearchParams(window.location.search);const token=urlParams.get('token');const plan=urlParams.get('plan');const price=urlParams.get('price');if(!token){alert('❌ لینک پرداخت نامعتبر است. لطفاً دوباره از صفحه اشتراک اقدام کنید.');window.location.href='eshterak.html'}else{document.getElementById('planName').innerText=plan;document.getElementById('planPrice').innerText=price+" تومان";document.getElementById('cardNumber').innerText=MY_CARD_NUMBER;document.getElementById('cardOwnerName').innerText=MY_NAME;document.getElementById('goToDeliveryBtn').href=`delivery.html?token=${token}`}</script></body></html>
